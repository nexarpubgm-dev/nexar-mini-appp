<script>
const $=s=>document.querySelector(s);

const SC={FAOL:'#22c55e',KUTILMOQDA:'#f59e0b',"TO'LDI":'#f59e0b',YAKUNLANGAN:'#e5142d'};
const NM=['Sniper_UZ','NightFox','Viper','Shadow','Toxic','Kaiser','Reaper','Blaze','Ghost','Nova','Storm','Ace'];
let P=NM.map((n,i)=>({id:i+1,nick:n,pid:String(510000000+i*7391),tg:n.toLowerCase(),b:i%3==0?['VETERAN']:i==4?['MVP','SNIPER']:[]}));
const me={id:0,nick:'',pid:'',tg:'mirzhayev',b:[]};P.push(me);
try{Object.assign(me,JSON.parse(localStorage.nx||'{}'))}catch(e){}
let adm=false,tb='t',cat='HAMMASI',stt='BARCHA HOLAT',q='',cur=null,dtab='s',log=[],unread=0,aid=10,shot=null;
const pl=u=>P.find(p=>p.id===u),nm=u=>u==null?'—':(pl(u)&&pl(u).nick)||'—';
const rnd=()=>String(Math.floor(1e6+Math.random()*9e6)),pw=()=>Math.random().toString(36).slice(2,6).toUpperCase();
const fee=t=>t.fee?t.fee.toLocaleString('ru')+" so'm":'BEPUL';
const mk=(id,title,mode,map,cat,status,f,n,lk)=>({id,title,mode,map,cat,status,fee:f,pay:f?"Karta: 8600 1234 5678 9012 · NEXAR ESPORTS":'',n,slots:Array.from({length:n},(_,i)=>({s:i<lk?'LOCKED':'OPEN',u:i<lk?i+1:null})),rounds:null,champ:null,wl:[],team:1,rules:'',start:0});
let T=[mk(1,'NEXAR CUP #12','TDM','','ELITE','FAOL',0,8,7),mk(2,'ERANGEL MEGA CUP','BOSHQA','Erangel','PRO','FAOL',15000,20,5),mk(3,'GIRLS SHOWDOWN','TDM','','GIRLS',"TO'LDI",0,8,8),mk(4,'LIVIK BATTLE #3','BOSHQA','Livik','ELITE','YAKUNLANGAN',0,16,16)];
T[1].slots[5]={s:'PENDING',u:9};T[3].champ=3;
let apps=[{id:1,t:2,n:6,u:9,shot:'seed'}];
P[8].pid=P[0].pid;[3,1,2,2,1,0,4,0,0,1,0,0,0].forEach((w,i)=>P[i].w=w);P[6].b.push('TOP PLAYER');
T[0].rules="1) Faqat o'z akkauntingiz bilan o'ynang.\n2) Room ma'lumotini boshqalarga bermang.\n3) Kechikkan o'yinchi texnik mag'lub hisoblanadi.";
T[0].start=Date.now()+45*60000;T[1].start=Date.now()+90*60000;T.push(mk(5,'SANHOK NIGHT','BOSHQA','Sanhok','PRO','KUTILMOQDA',0,12,3));T[4].start=Date.now()+75000;
let hp=false,reqs=[],aud=[],helpers=[],ban=new Set(),sp={t:'NEXAR × GAMESTORE'},rq=0;
const cd=ms=>{const s=Math.max(0,Math.floor(ms/1000));return [s/3600|0,s%3600/60|0,s%60].map(x=>String(x).padStart(2,'0')).join(':')};
const tm=t=>t.team==2?'DUO':t.team==4?'SQUAD':'SOLO';
const cdS=t=>t.start>Date.now()?`<span class=tg data-s=${t.start}>⏱ ${cd(t.start-Date.now())}</span>`:'';
const can=()=>adm||hp;
const ad=x=>{aud.unshift({x,t:new Date().toLocaleTimeString('uz',{hour:'2-digit',minute:'2-digit'}),r:adm?'Admin':'Yordamchi'})};
const FQ=[["To'lov qanday qilinadi?","Pullik turnirda «Qo'shilish» ni bosing, to'lovni rekvizitlarga o'tkazing va skrinshotni yuklang. Admin tasdiqlagach slotingiz band bo'ladi."],["Room ID qachon beriladi?","Setka shakllangach o'z juftligingiz kartasida Room ID va parol chiqadi. Uni faqat siz va raqibingiz ko'radi."],["Arizam tasdiqlanmasa?","Bot sizga xabar yuboradi. Savollar uchun @mirzhayev ga yozing."],["Turnirdan chiqib ketsam?","Turnir ichida «Arizani bekor qilish» ni bosing. Pullik bo'lsa, qaytarish so'rovi adminga ketadi."],["Zaxira nima?","Joylar to'lganda zaxiraga yozilasiz. Kimdir chiqsa, o'rin avtomatik sizga beriladi."]];
function freeSlot(t,n){t.slots[n-1]={s:'OPEN',u:null};if(t.wl.length){const u=t.wl.shift();t.slots[n-1]={s:'PENDING',u};apps.push({id:++aid,t:t.id,n,u,shot:null,tm:[]});bot(u,`🎉 <b>Zaxiradan o'rin bo'shadi!</b><br>🏆 ${t.title}<br>🎯 Slot #${n}<br>⏳ Arizangiz admin ko'rib chiqishiga yuborildi`)}}

function gen(t){const L=t.slots.filter(s=>s.s==='LOCKED').map(s=>s.u);let sz=2;while(sz<L.length)sz*=2;const pr=sz/2,two=L.length-pr,m=[];let k=0;
for(let i=0;i<pr;i++){const a=L[k++],b=i<two?L[k++]:null;m.push({a,b:b===undefined?null:b,w:b==null?a:null,room:b==null?null:rnd(),pw:b==null?null:pw()})}
t.rounds=[m];while(t.rounds[t.rounds.length-1].length>1)t.rounds.push(Array.from({length:t.rounds[t.rounds.length-1].length/2},()=>({a:null,b:null,w:null,room:null,pw:null})));prop(t)}
function prop(t){const R=t.rounds;for(let r=0;r<R.length-1;r++)R[r].forEach((m,i)=>{const n=R[r+1][i>>1];n[i%2?'b':'a']=m.w;if(n.a!=null&&n.b!=null&&!n.room){n.room=rnd();n.pw=pw()}})}
const sn=(t,r)=>{const c=t.rounds[r].length;return c==1?'FINAL':c==2?'YARIM FINAL':c==4?'CHORAK FINAL':'1/'+c+' FINAL'};

else if(t.wl.includes(me.id))h+=`<div class=nt style="background:#f59e0b18;color:var(--or);border:1px solid #f59e0b55">📋 Siz zaxiradasiz · navbat: ${t.wl.indexOf(me.id)+1}</div>`;

const c=t.champ;h+=`<div class=champ>🏆 CHEMPION<b>${c!=null?nm(c):'— kutilmoqda —'}</b></div>`;if(c!=null)h+=wide('btn o','cc('+t.id+')','🖼 Chempion kartasi');if(adm)h+=`<div class=mu style="text-align:center;margin:8px 14px 10px">Admin: g'olib o'yinchini bosib belgilang</div>`}}

function mkb(id){const t=T.find(x=>x.id==id);if(t.slots.filter(s=>s.s=='LOCKED').length<2){toast('Kamida 2 ta tasdiqlangan ishtirokchi kerak');return}gen(t);dtab='b';ad(t.title+': setka yaratildi');bot(-1,`🎮 <b>${t.title}</b> setkasi tayyor!<br>Bracketni ko'ring va o'z juftligingizni tekshiring.`);refresh()}
function rr(tid,r,i){const m=T.find(x=>x.id==tid).rounds[r][i];modal(`<div class=mt>🔑 Room va hisob</div><div class=mu style="margin-bottom:12px">${nm(m.a)} vs ${nm(m.b)}</div><label>Room ID (faqat raqam)</label><input id=rid inputmode=numeric value="${m.room||''}" oninput=dg(this)><label>Parol</label><input id=rpw value="${m.pw||''}"><button class=btn style="width:100%;margin-bottom:10px" onclick="$('#rid').value=rnd();$('#rpw').value=pw()">🎲 Random</button><label>Hisob (masalan 25:18)</label><input id=rsc value="${m.sc||''}" placeholder="25:18" oninput="this.value=this.value.replace(/[^0-9:]/g,'')"><div class=row><button class=btn onclick=closeM()>Bekor</button><button class="btn p" onclick=srr(${tid},${r},${i})>Saqlash</button></div>`)}
function srr(tid,r,i){const m=T.find(x=>x.id==tid).rounds[r][i],id=$('#rid').value.trim(),p=$('#rpw').value.trim();if(!id)return toast('Room ID kiriting');m.room=id;m.pw=p||'—';m.sc=$('#rsc').value.trim();ad(nm(m.a)+' vs '+nm(m.b)+': room/hisob yangilandi');closeM();refresh();toast('Saqlandi ✓')}
function win(tid,r,i,u){const t=T.find(x=>x.id==tid),m=t.rounds[r][i];if(m.a==null||m.b==null||m.w===u)return;const nx=t.rounds[r+1]&&t.rounds[r+1][i>>1];if(nx&&nx.w!=null){toast("Keyingi bosqich natijasi belgilangan");return}
m.w=u;prop(t);ad(t.title+' · '+sn(t,r)+': g\'olib '+nm(u));if(r==t.rounds.length-1){setChamp(t,u);bot(u,`🏆 <b>CHEMPION!</b><br>${t.title} turniri g'olibi — <b>${nm(u)}</b>!<br>Tabriklaymiz! 👑`)}else bot(u,`🔥 <b>Tabriklaymiz, ${nm(u)}!</b><br>${t.title}<br>Siz keyingi bosqichga o'tdingiz: <b>${sn(t,r+1)}</b>`);refresh()}
function pw2(tid,u){const t=T.find(x=>x.id==tid);setChamp(t,u);ad(t.title+': g\'olib '+nm(u));bot(u,`🏆 <b>CHEMPION!</b><br>${t.title} g'olibi — <b>${nm(u)}</b>!<br>Tabriklaymiz! 👑`);refresh()}
function rem(id){const t=T.find(x=>x.id==id);bot(-1,`⏰ <b>${t.title}</b> — o'yin boshlanishiga oz qoldi!<br>Tayyor bo'ling. Room ma'lumoti setkada.`);ad(t.title+': eslatma yuborildi')}
function dup(id){const t=T.find(x=>x.id==id),n=JSON.parse(JSON.stringify(t));n.id=Math.max(...T.map(x=>x.id))+1;n.title+=' (nusxa)';n.status='KUTILMOQDA';n.slots=Array.from({length:n.n},()=>({s:'OPEN',u:null}));n.rounds=null;n.champ=null;n.wl=[];n.start=0;T.unshift(n);ad(t.title+': nusxalandi');closeDet();main();toast('Nusxa yaratildi ✓')}
function cc(tid){const t=T.find(x=>x.id==tid),c=document.createElement('canvas');c.width=600;c.height=800;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,800);g.addColorStop(0,'#1a0509');g.addColorStop(1,'#0a0a0c');x.fillStyle=g;x.fillRect(0,0,600,800);x.strokeStyle='#f5b800';x.lineWidth=6;x.strokeRect(24,24,552,752);x.textAlign='center';x.fillStyle='#e5142d';x.font='bold 34px Oswald,Impact,sans-serif';x.fillText('NEXAR ESPORTS',300,110);x.font='150px serif';x.fillText('🏆',300,330);x.fillStyle='#f5b800';x.font='bold 30px Oswald,Impact,sans-serif';x.fillText('CHEMPION',300,420);x.fillStyle='#fff';x.font='bold 64px Oswald,Impact,sans-serif';x.fillText(nm(t.champ).toUpperCase(),300,510);x.font='24px sans-serif';x.fillStyle='#ffffffaa';x.fillText(t.title,300,580);x.fillText(new Date().toLocaleDateString('uz'),300,620);x.fillStyle='#e5142d';x.font='bold 20px sans-serif';x.fillText('PUBG MOBILE · TURNIR',300,730);
modal(`<div class=mt>🖼 Chempion kartasi</div><img src="${c.toDataURL('image/png')}" style="width:100%;border-radius:12px;margin:12px 0"><div class=mu>Rasmni bosib turing → saqlang yoki Telegram'da ulashing</div>`)}
function del(id){cf("Turnir o'chirilsinmi?",'del2('+id+')')}
function del2(id){const t=T.find(x=>x.id==id);ad(t.title+": o'chirildi");T=T.filter(t=>t.id!=id);apps=apps.filter(a=>a.t!=id);closeDet();main()}
function edit(id){const t=T.find(x=>x.id==id);modal(`<div class=mt>Tahrirlash</div><label>Nomi</label><input id=en value="${t.title}">${t.fee?`<label>Narx (so'm)</label><input id=ef inputmode=numeric value=${t.fee} oninput=dg(this)>`:''}<label>Boshlanishiga necha daqiqa qoldi (0 = taymersiz)</label><input id=est inputmode=numeric value=0 oninput=dg(this)><label>Qoidalar</label><textarea id=erl rows=4>${t.rules}</textarea><div class=row><button class=btn onclick=closeM()>Bekor</button><button class="btn p" onclick=sedit(${id})>Saqlash</button></div>`)}
function sedit(id){const t=T.find(x=>x.id==id);t.title=$('#en').value.trim()||t.title;if($('#ef'))t.fee=+$('#ef').value||t.fee;t.rules=$('#erl').value.trim();const m=+$('#est').value;if(m)t.start=Date.now()+m*60000;ad(t.title+': tahrirlandi');closeM();refresh()}
function pk(e){e.parentElement.querySelectorAll('.ch').forEach(c=>c.classList.remove('on'));e.classList.add('on');const g=e.parentElement.dataset.g;if(g=='mode'){$('#mp').hidden=e.dataset.v=='TDM';$('#tmw').hidden=e.dataset.v=='TDM'}if(g=='fee')$('#fp').hidden=e.dataset.v=='BEPUL'}
const gv=g=>$(`[data-g=${g}] .on`).dataset.v;
function create(){modal(`<div class=mt>Yangi turnir</div><label>Nomi</label><input id=cn placeholder="NEXAR CUP #13">
<label>Turi</label><div class=chs data-g=mode><b class="ch on" data-v=TDM onclick=pk(this)>⚔️ TDM</b><b class=ch data-v=BOSHQA onclick=pk(this)>🗺 BOSHQA</b></div>
<div id=mp hidden><label>Karta</label><div class=chs data-g=map>${['Erangel','Livik','Miramar','Sanhok','Vikendi'].map((m,i)=>`<b class="ch ${i?'':'on'}" data-v=${m} onclick=pk(this)>${m}</b>`).join('')}</div></div>
<div id=tmw hidden><label>Jamoa</label><div class=chs data-g=team><b class="ch on" data-v=1 onclick=pk(this)>SOLO</b><b class=ch data-v=2 onclick=pk(this)>DUO</b><b class=ch data-v=4 onclick=pk(this)>SQUAD</b></div></div>
<label>O'rinlar soni (8, 16, 32 yoki istalgan)</label><input id=cs inputmode=numeric value=8 oninput=dg(this)>
<label>Kategoriya</label><div class=chs data-g=cat>${['ELITE','PRO','GIRLS'].map((m,i)=>`<b class="ch ${i?'':'on'}" data-v=${m} onclick=pk(this)>${m}</b>`).join('')}</div>
<label>Kirish</label><div class=chs data-g=fee><b class="ch on" data-v=BEPUL onclick=pk(this)>BEPUL</b><b class=ch data-v=PULLIK onclick=pk(this)>PULLIK</b></div>
<div id=fp hidden><input id=cf inputmode=numeric placeholder="Narx (so'm)" oninput=dg(this)><input id=cp placeholder="To'lov rekvizitlari (karta raqami)"></div>
<label>Boshlanishiga necha daqiqa (ixtiyoriy)</label><input id=cst inputmode=numeric placeholder="masalan 60" oninput=dg(this)>
<label>Qoidalar (ixtiyoriy)</label><textarea id=crl rows=3 placeholder="Turnir qoidalari..."></textarea>
<div class=row><button class=btn onclick=closeM()>Bekor</button><button class="btn p" onclick=mkT()>Yaratish</button></div>`)}
function mkT(){const title=$('#cn').value.trim(),n=+$('#cs').value,mode=gv('mode'),paid=gv('fee')=='PULLIK',f=paid?+$('#cf').value:0;
if(!title)return toast('Nomini kiriting');if(n<2)return toast("Kamida 2 ta o'rin");if(paid&&!f)return toast('Narxni kiriting');
const t=mk(Math.max(0,...T.map(x=>x.id))+1,title,mode,mode=='TDM'?'':gv('map'),gv('cat'),'FAOL',f,n,0);t.pay=paid?($('#cp').value.trim()||"Rekvizitlar admin tomonidan yuboriladi"):'';t.team=mode=='TDM'?1:+gv('team');t.rules=$('#crl').value.trim();const st=+$('#cst').value;t.start=st?Date.now()+st*60000:0;T.unshift(t);ad(t.title+': yaratildi');closeM();bot(-1,openMsg(t));refresh()}
function bgrid(p,ed){return `<div class=bg8>${B.map(([k,i,d])=>`<div class="bd ${p.b.includes(k)?'on':''} ${ed?'ed':''}" ${ed?`onclick="award(${p.id},&quot;${k}&quot;)"`:''}><i>${i}</i><b>${k}</b></div>`).join('')}</div>`}
function award(u,k){const p=pl(u),i=p.b.indexOf(k);if(i>=0)p.b.splice(i,1);else{p.b.push(k);const bb=B.find(x=>x[0]==k);bot(u,`🎖 <b>Yangi nishon!</b><br>${bb[1]} <b>${k}</b> — ${bb[2]}<br>Tabriklaymiz, ${p.nick}!`)}closeM();player(u);refresh()}
function tb2(u,k){if(k==1){ban.has(u)?ban.delete(u):ban.add(u);ad(nm(u)+(ban.has(u)?': bloklandi':': blokdan chiqarildi'))}else{const i=helpers.indexOf(u);i>=0?helpers.splice(i,1):helpers.push(u);ad(nm(u)+(i>=0?': yordamchilikdan olindi':': yordamchi admin qilindi'))}closeM();player(u);refresh()}
function player(u){const p=pl(u);if(!p.nick)return;modal(`<div class=row style="gap:12px"><div class=av style="width:52px;height:52px;font-size:20px">${p.nick[0].toUpperCase()}</div><div><div class=mt>${p.nick}</div><div class=mu>PUBG ID: ${p.pid}<br>@${p.tg} · 🏆 ${p.w||0} g'alaba</div>${ban.has(p.id)?'<div class=mu style="color:#ff5a6e">🚫 Bloklangan</div>':''}${helpers.includes(p.id)?'<div class=mu style="color:var(--or)">🛡 Yordamchi admin</div>':''}</div></div><div class=h style="margin-top:14px">NISHONLAR${adm?' · admin: bosib bering/oling':''}</div>${bgrid(p,adm)}<a class="btn p" style="display:block;margin-top:14px;text-decoration:none;color:#fff;text-align:center" href="https://t.me/${p.tg}" target=_blank>✉️ Xabar yozish</a>${adm&&p.id!==0?`<div class=row style="margin-top:8px"><button class=btn onclick="tb2(${p.id},1)">${ban.has(p.id)?'✅ Blokdan chiqarish':'🚫 Bloklash'}</button><button class=btn onclick="tb2(${p.id},2)">${helpers.includes(p.id)?'Yordamchilikdan olish':'🛡 Yordamchi'}</button></div>`:''}`)}
function srch(){const s=$('#srch');s.innerHTML=`<div class=dh><button class=bk onclick="$('#srch').classList.remove('in')">←</button><input id=sq placeholder="NIK yoki ID bo'yicha qidirish..." style="margin:0" oninput=sr(this.value)></div><div style="padding:6px 14px" id=sr></div>`;sr('');requestAnimationFrame(()=>{s.classList.add('in');$('#sq').focus()})}
function sr(v){v=v.trim().toLowerCase();const r=P.filter(p=>p.nick&&(!v||p.nick.toLowerCase().includes(v)||p.pid.includes(v)));$('#sr').innerHTML=r.map(p=>`<button class=pl onclick="player(${p.id})"><div class=av>${p.nick[0].toUpperCase()}</div><div style="flex:1"><b>${p.nick}</b><div class=mu>ID ${p.pid}</div></div><span>${p.b.map(k=>B.find(x=>x[0]==k)[1]).join('')}</span></button>`).join('')||'<div class=mu style="text-align:center;padding:30px">O\'yinchi topilmadi</div>'}
function inbox(){unread=0;hdr();modal(`<div class=mt>🤖 NEXAR BOT</div><div class=mu style="margin-bottom:8px">Avtomatik xabarlar va savollarga javoblar</div><div class=chs>${FQ.map((f,i)=>`<b class=ch onclick=askB(${i})>${f[0]}</b>`).join('')}</div>${log.map(l=>`<div class=bub><small>→ ${lab(l.to)} · ${l.t}</small>${l.h}</div>`).join('')||'<div class=mu>Hozircha xabar yo\'q</div>'}`)}
function askB(i){log.unshift({to:0,h:`<b>❓ ${FQ[i][0]}</b><br>${FQ[i][1]}`,t:new Date().toLocaleTimeString('uz',{hour:'2-digit',minute:'2-digit'})});closeM();inbox()}
function faq(){modal(`<div class=mt>❓ Savol-javob</div><div class=mu style="margin-bottom:10px">Bot ham shu savollarga avtomatik javob beradi</div>${FQ.map(([q,a])=>`<details class=fq><summary>${q}</summary><div>${a}</div></details>`).join('')}`)}
function hof(){const c=T.filter(t=>t.champ!=null),top=[...P].filter(p=>p.nick&&p.w>0).sort((a,b)=>b.w-a.w).slice(0,10);modal(`<div class=mt>👑 HALL OF FAME</div><div class=h style="margin-top:12px">🏅 TOP-10 REYTING (g'alabalar)</div>${top.map((p,i)=>`<button class=pl onclick="player(${p.id})"><b style="width:22px;color:${i?'var(--m)':'var(--g)'}">${i+1}</b><div style="flex:1"><b>${p.nick}</b></div><span style="color:var(--g)">🏆 ${p.w}</span></button>`).join('')||'<div class=mu>Reyting bo\'sh</div>'}<div class=h style="margin-top:12px">CHEMPIONLAR</div>${c.map(t=>`<div class=champ style="margin:0 0 8px;text-align:left;display:flex;justify-content:space-between;align-items:center"><span style="color:#fff;font-size:12px">${t.title}</span><b style="font-size:14px;margin:0">🏆 ${nm(t.champ)}</b></div>`).join('')||'<div class=mu>Hali chempion yo\'q</div>'}`)}
function save(){const n=$('#pn').value.trim(),i=$('#pi').value.trim();if(!n||!i)return toast('NIK va ID ni kiriting');const first=!me.nick;me.nick=n;me.pid=i;try{localStorage.nx=JSON.stringify({nick:n,pid:i})}catch(e){}
if(first)bot(0,`👋 <b>NEXAR ESPORTS</b> ga xush kelibsiz, <b>${n}</b>!<br>✅ Profil saqlandi<br>🆔 PUBG ID: ${i}<br>Endi turnirlarga qo'shilishingiz mumkin 🎮`);toast('Saqlandi ✓');refresh()}
function bc(){const v=$('#bm').value.trim();if(!v)return;bot(-1,'📢 '+v);$('#bm').value=''}
function prof(m){const my=T.filter(t=>t.slots.some(s=>s.u===me.id)),hs=[];T.forEach(t=>t.rounds&&t.rounds.forEach((R,r)=>R.forEach(mt=>{if((mt.a===me.id||mt.b===me.id)&&mt.a!=null&&mt.b!=null){const o=mt.a===me.id?mt.b:mt.a;hs.push([t.title,sn(t,r),nm(o),mt.w==null?'…':mt.w===me.id?'G':'M',mt.sc||''])}})));
const S={tr:T.length,ap:apps.length,lk:T.reduce((a,t)=>a+t.slots.filter(s=>s.s=='LOCKED').length,0),inc:T.reduce((a,t)=>a+t.fee*t.slots.filter(s=>s.s=='LOCKED').length,0),pl:P.filter(p=>p.nick).length};
const box=(l,v)=>`<div class=sec style="margin:0;text-align:center;padding:10px"><b style="color:var(--r);font-size:18px">${v}</b><div class=mu style="font-size:9px">${l}</div></div>`;
m.innerHTML=`<div class=pg><div class=sec style="margin:0 0 12px;display:flex;gap:12px;align-items:center"><div class=av style="width:54px;height:54px;font-size:20px">${(me.nick||'?')[0].toUpperCase()}</div><div><b>${me.nick||'Telegram foydalanuvchi'}</b><div class=mu>@${me.tg}${adm?' · <span style="color:var(--r)">ADMIN</span>':hp?' · <span style="color:var(--or)">YORDAMCHI</span>':''}</div></div></div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">${box('TURNIR',my.length)}${box("G'ALABA",me.w||0)}${box('NISHON',me.b.length)}</div>
<div class=sec style="margin:0 0 12px"><div class=h>PUBG MA'LUMOTLARI</div><label>PUBG Nickname</label><input id=pn value="${me.nick}" placeholder="Nickname"><label>PUBG ID (faqat raqam)</label><input id=pi value="${me.pid}" inputmode=numeric oninput=dg(this) placeholder="123456789"><button class="btn p" style="width:100%" onclick=save()>Saqlash</button><div class=mu style="margin-top:8px;color:${me.nick?'#4ade80':'var(--or)'}">${me.nick?'✓ Saqlangan — turnirlarga ariza yuborishingiz mumkin':"⚠️ Turnirga qo'shilish uchun avval to'ldiring"}</div></div>
<div class=sec style="margin:0 0 12px"><div class=h>NISHONLAR</div>${bgrid(me,false)}</div>
<div class=sec style="margin:0 0 12px"><div class=h>MENING TURNIRLARIM</div>${my.map(t=>{const s=t.slots.find(x=>x.u===me.id);return `<button class="row sb" style="width:100%;padding:8px 0" onclick="tab('t');openT(${t.id})"><span style="font-size:13px;font-weight:700">${t.title}</span><span class=chip style="background:${s.s=='LOCKED'?'#22c55e22':'#f59e0b22'};color:${s.s=='LOCKED'?'#4ade80':'var(--or)'}">${s.s=='LOCKED'?'QATNASHMOQDA':"KO'RIB CHIQILMOQDA"}</span></button>`}).join('')||`<div class=mu>Hali turnirga qo'shilmagansiz</div>`}</div>
<div class=sec style="margin:0 0 12px"><div class=h>📜 O'YINLAR TARIXI</div>${hs.map(x=>`<div class="row sb" style="padding:7px 0;border-bottom:1px solid #ffffff0d;font-size:12px"><div><b>vs ${x[2]}</b><div class=mu>${x[0]} · ${x[1]}${x[4]?' · '+x[4]:''}</div></div><span class=chip style="background:${x[3]=='G'?'#22c55e22':x[3]=='M'?'#e5142d22':'#f59e0b22'};color:${x[3]=='G'?'#4ade80':x[3]=='M'?'#ff5a6e':'var(--or)'}">${x[3]=='G'?"G'ALABA":x[3]=='M'?"MAG'LUBIYAT":'KUTILMOQDA'}</span></div>`).join('')||`<div class=mu>Hali o'yin yo'q</div>`}</div>
<button class=btn style="width:100%;margin-bottom:8px" onclick=faq()>❓ Savol-javob</button>
<a class="btn" style="display:block;text-decoration:none;color:#fff;margin-bottom:12px;text-align:center" href="https://t.me/mirzhayev" target=_blank>🆘 Yordam · @mirzhayev</a>
${can()?`<div class=sec style="margin:0 0 12px;border-color:#e5142d55"><div class=h style="color:var(--r)">📋 BARCHA ARIZALAR (${apps.length})</div>${apps.map(appRow).join('')||"<div class=mu>Arizalar yo'q</div>"}</div>
<div class=sec style="margin:0 0 12px;border-color:#e5142d55"><div class=h style="color:var(--r)">📨 SO'ROVLAR (${reqs.length})</div>${reqs.map(rqRow).join('')||"<div class=mu>Nizo va qaytarish so'rovlari yo'q</div>"}</div>`:''}
${adm?`<div class=sec style="margin:0 0 12px;border-color:#e5142d55"><div class=h style="color:var(--r)">📊 STATISTIKA</div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">${box('TURNIRLAR',S.tr)}${box("O'YINCHILAR",S.pl)}${box('KUTILAYOTGAN ARIZA',S.ap)}${box('TASDIQLANGAN',S.lk)}</div><div class=sec style="margin:8px 0 0;text-align:center"><b style="color:var(--g);font-size:18px">${S.inc.toLocaleString('ru')} so'm</b><div class=mu style="font-size:9px">TUSHUM (tasdiqlangan to'lovlar)</div></div></div>
<div class=sec style="margin:0 0 12px;border-color:#e5142d55"><div class=h style="color:var(--r)">🎖 NISHON BERISH / O'YINCHI BOSHQARUVI</div><button class="btn o" style="width:100%" onclick=srch()>🔍 O'yinchi qidirish</button><div class=mu style="margin-top:8px">🛡 Yordamchi adminlar: ${helpers.map(nm).join(', ')||'yo\'q'}<br>🚫 Bloklanganlar: ${[...ban].map(nm).join(', ')||'yo\'q'}</div></div>
<div class=sec style="margin:0 0 12px;border-color:#e5142d55"><div class=h style="color:var(--r)">🧾 ADMIN JURNALI</div>${aud.slice(0,8).map(a=>`<div class=mu style="padding:4px 0;border-bottom:1px solid #ffffff0d">${a.t} · <b style="color:#fff">${a.r}</b> · ${a.x}</div>`).join('')||"<div class=mu>Hozircha harakat yo'q</div>"}</div>
<div class=sec style="margin:0 0 12px;border-color:#e5142d55"><div class=h style="color:var(--r)">📢 BROADCAST</div><textarea id=bm rows=2 placeholder="Hammaga bot orqali xabar"></textarea><button class="btn p" style="width:100%" onclick=bc()>Yuborish</button></div>`:''}</div>`}
const sl=$('#sl');'NEXAR'.split('').forEach((c,i)=>{const s=document.createElement('i');s.textContent=c;s.style.animationDelay=i*.09+'s';sl.appendChild(s)});
hdr();main();
setTimeout(()=>{$('#splash').style.opacity=0;$('#app').style.display='block';setTimeout(()=>$('#splash').remove(),450)},2000);
</script></body></html>
